[project]
name = "lynch-reader"
version = "0.1.0"
description = "Read-only HTTP surface for the lynch mobile reader"
requires-python = ">=3.12"
dependencies = ["starlette>=0.47", "uvicorn>=0.35"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
