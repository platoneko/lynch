[project]
name = "lynch-reader"
version = "0.1.0"
description = "HTTP surface for the lynch mobile app: reader and chats"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.47",
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash>=0.25,<0.26",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
